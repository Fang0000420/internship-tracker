[project]
name = "internship-tracker"
version = "0.1.0"
description = "A command-line tool for tracking European AI internship opportunities."
readme = "README.md"
authors = [
    { name = "Ziyi Fang" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
internship-tracker = "internship_tracker.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true